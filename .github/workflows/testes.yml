name: testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # a ferramenta Grep dos agentes e o ripgrep: test-comandos-de-busca.sh roda as chamadas nele
      - run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: |
          for t in scripts/ci/test-*.sh; do
            echo "== $t"
            bash "$t"
          done
