<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="A auditoria de design">
  <defs>
    <pattern id="pg" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#f6f8fa" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8957e5"/>
    </marker>
  </defs>

  <rect width="960" height="400" rx="14" fill="#ffffff"/>
  <rect width="960" height="400" rx="14" fill="url(#pg)"/>
  <rect x="0" y="0" width="6" height="400" rx="3" fill="#8957e5"/>

  <text x="40" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" fill="#1f2328">A auditoria</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#59636e">cada achado em três partes — observação, problema, fix — e dois artefatos de saída</text>

  <!-- entrada -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="40" y="100" width="190" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="126" font-size="12.5" font-weight="700" fill="#1f2328">escopo</text>
    <text x="54" y="146" font-size="10.5" fill="#59636e">arquivos de UI do trabalho</text>
  </g>
  <path d="M234 132h32" stroke="#8957e5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- auditor -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="272" y="100" width="220" height="64" rx="10" fill="#f3edfd" stroke="#8957e5" stroke-width="1.5"/>
    <text x="286" y="126" font-size="12.5" font-weight="700" fill="#8250df">auditor-design</text>
    <text x="286" y="146" font-size="10.5" fill="#59636e">conformidade + 18 regras</text>
  </g>
  <path d="M496 132h32" stroke="#8957e5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- veredito mock -->
  <rect x="534" y="96" width="386" height="118" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="550" y="118" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#59636e">achado — observação → problema → fix</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="550" y="142" font-size="11.5" fill="#1f2328">arquivo.tsx:34 — PAGE_SIZE fixo em 10</text>
    <text x="550" y="162" font-size="11.5" fill="#1a7f37">→ usePagination(items, { auto: true })</text>
    <text x="550" y="182" font-size="10.5" fill="#59636e">por que importa: tela pela metade em monitor grande</text>
  </g>
  <text x="550" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700" fill="#8250df">veredito: APROVADO | REPROVADO</text>

  <!-- setas para artefatos -->
  <g stroke="#8957e5" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.7">
    <path d="M640 214v40h-155"/>
    <path d="M800 214v40"/>
  </g>

  <!-- artefatos -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="40" y="258" width="440" height="58" rx="10" fill="#f3edfd" stroke="#8957e5" stroke-width="1.2"/>
    <text x="56" y="282" font-size="12.5" font-weight="700" fill="#8250df">AUDIT.md</text>
    <text x="56" y="302" font-size="10.5" fill="#1f2328">adocao_tokens: 0.87 — a tendência revela o drift</text>

    <rect x="500" y="258" width="420" height="58" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
    <text x="516" y="282" font-size="12.5" font-weight="700" fill="#9a6700">DIVIDA.md</text>
    <text x="516" y="302" font-size="10.5" fill="#1f2328">prioridade = severidade × frequência / esforço</text>
  </g>

  <text x="480" y="360" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#59636e">achados médios/baixos não endereçados entram no registro — a auditoria atualiza, não recria</text>
</svg>
