<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="Ciclo de vida do design system">
  <defs>
    <pattern id="pg" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#f6f8fa" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8957e5"/>
    </marker>
  </defs>

  <rect width="960" height="330" rx="14" fill="#ffffff"/>
  <rect width="960" height="330" rx="14" fill="url(#pg)"/>
  <rect x="0" y="0" width="6" height="330" rx="3" fill="#8957e5"/>

  <text x="40" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" fill="#1f2328">Ciclo de vida do design system</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#59636e">do zero ao auditado — drift não corrigido vira dívida registrada, não silêncio</text>

  <!-- nós -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="40" y="110" width="150" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <circle cx="58" cy="128" r="9" fill="#59636e"/><text x="58" y="131.5" text-anchor="middle" font-size="10" fill="#ffffff">1</text>
    <text x="74" y="132" font-size="13" font-weight="700" fill="#1f2328">Ausente</text>
    <text x="54" y="156" font-size="10.5" fill="#59636e">sem DS declarado</text>

    <rect x="220" y="110" width="150" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <circle cx="238" cy="128" r="9" fill="#8957e5"/><text x="238" y="131.5" text-anchor="middle" font-size="10" fill="#ffffff">2</text>
    <text x="254" y="132" font-size="13" font-weight="700" fill="#1f2328">Cartografado</text>
    <text x="234" y="156" font-size="10.5" fill="#59636e">consistente: false</text>

    <rect x="400" y="110" width="150" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <circle cx="418" cy="128" r="9" fill="#8957e5"/><text x="418" y="131.5" text-anchor="middle" font-size="10" fill="#ffffff">3</text>
    <text x="434" y="132" font-size="13" font-weight="700" fill="#1f2328">Consistente</text>
    <text x="414" y="156" font-size="10.5" fill="#59636e">drift = 0</text>

    <rect x="580" y="110" width="150" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <circle cx="598" cy="128" r="9" fill="#8957e5"/><text x="598" y="131.5" text-anchor="middle" font-size="10" fill="#ffffff">4</text>
    <text x="614" y="132" font-size="13" font-weight="700" fill="#1f2328">Declarado</text>
    <text x="594" y="156" font-size="10.5" fill="#59636e">origem: usuário</text>

    <rect x="760" y="110" width="150" height="64" rx="10" fill="#f3edfd" stroke="#8957e5" stroke-width="1.5"/>
    <circle cx="778" cy="128" r="9" fill="#8957e5"/><text x="778" y="131.5" text-anchor="middle" font-size="10" fill="#ffffff">5</text>
    <text x="794" y="132" font-size="13" font-weight="700" fill="#8250df">Auditando</text>
    <text x="774" y="156" font-size="10.5" fill="#59636e">AUDIT + DIVIDA</text>
  </g>

  <!-- setas -->
  <g stroke="#8957e5" stroke-width="1.5" fill="none">
    <path d="M192 142h24" marker-end="url(#a)"/>
    <path d="M372 142h24" marker-end="url(#a)"/>
    <path d="M552 142h24" marker-end="url(#a)"/>
    <path d="M732 142h24" marker-end="url(#a)"/>
  </g>
  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#59636e" text-anchor="middle">
    <text x="205" y="192">cartografia automática</text>
    <text x="385" y="192">corrige o drift</text>
    <text x="745" y="192">audita a cada sprint</text>
  </g>

  <!-- saídas -->
  <path d="M835 174v28h-105" stroke="#8957e5" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.6"/>
  <rect x="520" y="202" width="190" height="32" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.2"/>
  <text x="615" y="223" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#d1242f">violações → painel Expx</text>
  <rect x="730" y="202" width="180" height="32" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="820" y="223" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#9a6700">drift → DIVIDA.md</text>

  <text x="480" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#59636e">DIVIDA.md é registro vivo · prioridade = severidade × frequência / esforço · aberto → em_progresso → resolvido</text>
  <text x="480" y="298" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#59636e">quick wins entram na próxima sprint · estruturais viram task própria · write-offs ficam diferidos com justificativa</text>
</svg>
