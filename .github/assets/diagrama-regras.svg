<svg xmlns="http://www.w3.org/2000/svg" width="960" height="696" viewBox="0 0 960 696" role="img" aria-label="As 18 boas praticas por severidade">
  <defs>
    <pattern id="pg" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#f6f8fa" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="696" rx="14" fill="#ffffff"/>
  <rect width="960" height="696" rx="14" fill="url(#pg)"/>
  <rect x="0" y="0" width="6" height="696" rx="3" fill="#8957e5"/>

  <text x="40" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" fill="#1f2328">As 18 boas práticas</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#59636e">toda regra tem evidência: o bug que aparece sem ela — violar regra é violação de método, não gosto pessoal</text>

  <!-- ===== coluna BLOQUEIO ===== -->
  <rect x="40" y="100" width="280" height="36" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.2"/>
  <text x="180" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#d1242f">BLOQUEIO — sprint não avança</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="40" y="150" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="170" font-size="12" font-weight="700" fill="#1f2328">B1 · Paginação adaptativa</text>
    <text x="54" y="187" font-size="10.5" fill="#59636e">tela pela metade em monitor grande</text>

    <rect x="40" y="208" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="228" font-size="12" font-weight="700" fill="#1f2328">B2 · Detalhe em modal, não drawer</text>
    <text x="54" y="245" font-size="10.5" fill="#59636e">usuário não compara registros</text>

    <rect x="40" y="266" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="286" font-size="12" font-weight="700" fill="#1f2328">B3 · Sub-nav em rail, não tabs</text>
    <text x="54" y="303" font-size="10.5" fill="#59636e">perda de contexto em painel denso</text>

    <rect x="40" y="324" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="344" font-size="12" font-weight="700" fill="#1f2328">B4 · Vazio dentro da tabela</text>
    <text x="54" y="361" font-size="10.5" fill="#59636e">usuário preso sem saída</text>

    <rect x="40" y="382" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="402" font-size="12" font-weight="700" fill="#1f2328">B5 · Destrutiva = AlertDialog</text>
    <text x="54" y="419" font-size="10.5" fill="#59636e">delete acidental sem confirmação</text>
  </g>
  <text x="54" y="466" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#59636e">cada regra tem comando de detecção</text>
  <text x="54" y="482" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#59636e">em references/00-boas-praticas.md</text>

  <!-- ===== coluna ALTO ===== -->
  <rect x="340" y="100" width="280" height="36" rx="8" fill="#f3edfd" stroke="#8957e5" stroke-width="1.2"/>
  <text x="480" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#8250df">ALTO — corrigir antes de entregar</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="340" y="150" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="170" font-size="12" font-weight="700" fill="#1f2328">A1 · Zero hex hardcoded</text>
    <text x="354" y="187" font-size="10.5" fill="#59636e">dark mode inutilizável</text>

    <rect x="340" y="208" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="228" font-size="12" font-weight="700" fill="#1f2328">A2 · Vocabulário fechado de cores</text>
    <text x="354" y="245" font-size="10.5" fill="#59636e">coesão visual perdida</text>

    <rect x="340" y="266" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="286" font-size="12" font-weight="700" fill="#1f2328">A3 · Display não-genérica</text>
    <text x="354" y="303" font-size="10.5" fill="#59636e">toda tela parece a mesma</text>

    <rect x="340" y="324" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="344" font-size="12" font-weight="700" fill="#1f2328">A4 · Accent com variante dark</text>
    <text x="354" y="361" font-size="10.5" fill="#59636e">cor some em fundo escuro</text>

    <rect x="340" y="382" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="402" font-size="12" font-weight="700" fill="#1f2328">A5 · Loading/error/empty cobertos</text>
    <text x="354" y="419" font-size="10.5" fill="#59636e">tela quebrada sem feedback</text>

    <rect x="340" y="440" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="460" font-size="12" font-weight="700" fill="#1f2328">A6 · Contraste WCAG AA</text>
    <text x="354" y="477" font-size="10.5" fill="#59636e">texto ilegível para baixa visão</text>
    <rect x="570" y="448" width="36" height="16" rx="8" fill="#dafbe1"/>
    <text x="588" y="460" text-anchor="middle" font-size="9" fill="#1a7f37">a11y</text>

    <rect x="340" y="498" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="518" font-size="12" font-weight="700" fill="#1f2328">A7 · Focus ring sempre visível</text>
    <text x="354" y="535" font-size="10.5" fill="#59636e">teclado navega às cegas</text>
    <rect x="570" y="506" width="36" height="16" rx="8" fill="#dafbe1"/>
    <text x="588" y="518" text-anchor="middle" font-size="9" fill="#1a7f37">a11y</text>

    <rect x="340" y="556" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="576" font-size="12" font-weight="700" fill="#1f2328">A8 · Alvo ≥ 36px + aria-label</text>
    <text x="354" y="593" font-size="10.5" fill="#59636e">clique impreciso, botão sem nome</text>
    <rect x="570" y="564" width="36" height="16" rx="8" fill="#dafbe1"/>
    <text x="588" y="576" text-anchor="middle" font-size="9" fill="#1a7f37">a11y</text>

    <rect x="340" y="614" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="354" y="634" font-size="12" font-weight="700" fill="#1f2328">A9 · reduced-motion</text>
    <text x="354" y="651" font-size="10.5" fill="#59636e">enfeite vira barreira vestibular</text>
    <rect x="570" y="622" width="36" height="16" rx="8" fill="#dafbe1"/>
    <text x="588" y="634" text-anchor="middle" font-size="9" fill="#1a7f37">a11y</text>
  </g>

  <!-- ===== coluna MEDIO ===== -->
  <rect x="640" y="100" width="280" height="36" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="780" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#9a6700">MÉDIO — resolver quando possível</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="640" y="150" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="654" y="170" font-size="12" font-weight="700" fill="#1f2328">M1 · Tom estético por task</text>
    <text x="654" y="187" font-size="10.5" fill="#59636e">mistura de estilos na feature</text>

    <rect x="640" y="208" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="654" y="228" font-size="12" font-weight="700" fill="#1f2328">M2 · Animação com propósito</text>
    <text x="654" y="245" font-size="10.5" fill="#59636e">ruído visual que cansa</text>

    <rect x="640" y="266" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="654" y="286" font-size="12" font-weight="700" fill="#1f2328">M3 · Densidade h-9 · ~52px</text>
    <text x="654" y="303" font-size="10.5" fill="#59636e">painel parece landing page</text>

    <rect x="640" y="324" width="280" height="48" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="654" y="344" font-size="12" font-weight="700" fill="#1f2328">M4 · tabular-nums</text>
    <text x="654" y="361" font-size="10.5" fill="#59636e">coluna de valores bagunçada</text>
  </g>

  <rect x="640" y="396" width="36" height="16" rx="8" fill="#dafbe1"/>
  <text x="658" y="408" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#1a7f37">a11y</text>
  <text x="684" y="409" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#59636e">regras A6–A9: contraste, foco,</text>
  <text x="684" y="425" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#59636e">alvo e reduced-motion — WCAG AA</text>
</svg>
