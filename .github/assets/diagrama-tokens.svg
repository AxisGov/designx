<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Tiers de token">
  <defs>
    <pattern id="pg" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#f6f8fa" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8957e5"/>
    </marker>
  </defs>

  <rect width="960" height="340" rx="14" fill="#ffffff"/>
  <rect width="960" height="340" rx="14" fill="url(#pg)"/>
  <rect x="0" y="0" width="6" height="340" rx="3" fill="#8957e5"/>

  <text x="40" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" fill="#1f2328">Tiers de token</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#59636e">o componente nunca fala com o valor bruto — sempre através de um alias</text>

  <!-- fluxo de tiers -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="40" y="96" width="340" height="60" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="120" font-size="12.5" font-weight="700" fill="#8250df">TIER 1 · GLOBAL (raw)</text>
    <text x="54" y="140" font-size="11" fill="#59636e">--blue-500: 222 47% 41%</text>

    <rect x="40" y="180" width="340" height="60" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="204" font-size="12.5" font-weight="700" fill="#8250df">TIER 2 · ALIAS (semântico)</text>
    <text x="54" y="224" font-size="11" fill="#59636e">--primary → var(--blue-700)</text>

    <rect x="40" y="264" width="340" height="60" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="54" y="288" font-size="12.5" font-weight="700" fill="#8250df">TIER 3 · COMPONENTE</text>
    <text x="54" y="308" font-size="11" fill="#59636e">--button-bg → var(--primary)</text>
  </g>
  <g stroke="#8957e5" stroke-width="1.5" fill="none">
    <path d="M210 156v24" marker-end="url(#a)"/>
    <path d="M210 240v24" marker-end="url(#a)"/>
  </g>
  <text x="220" y="172" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#59636e">referencia</text>
  <text x="220" y="256" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#59636e">referencia</text>

  <!-- painel drift -->
  <rect x="620" y="96" width="300" height="228" rx="10" fill="#ffffff" stroke="#ff8182" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="640" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#d1242f">drift de tier — a cartografia lista</text>
  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1f2328">
    <text x="640" y="156" fill="#d1242f">✕</text>
    <text x="658" y="156">componente → raw direto</text>
    <text x="640" y="192" fill="#d1242f">✕</text>
    <text x="658" y="192">2 tokens, mesmo valor,</text>
    <text x="658" y="208">nomes diferentes</text>
    <text x="640" y="244" fill="#d1242f">✕</text>
    <text x="658" y="244">valor bruto repetido 3+:</text>
    <text x="658" y="260">token implícito faltando</text>
  </g>
  <text x="640" y="304" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#59636e">nada inventado — evidência em arquivo:linha</text>
</svg>
